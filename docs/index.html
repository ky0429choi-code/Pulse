<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Pulse</title>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/print.css" />
  <script src="./env.js"></script>
</head>
<body>
  <div class="print-header" id="printHeader">
    <div class="site-name" id="printSiteName"></div>
    <div class="print-meta" id="printMeta"></div>
  </div>
  <div class="login-overlay show" id="loginOverlay">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-mark">OP</div>
        <div>
          <div class="eyebrow">운영 콘솔</div>
          <h1>Pulse</h1>
          <p>인가된 사용자만 접근할 수 있습니다. 보호된 운영 데이터를 열려면 로그인하세요.</p>
        </div>
      </div>

      <div class="login-grid">
        <label class="field">
          <span>싱글 ID</span>
          <div class="login-id-wrap">
            <input id="loginId" class="input login-id-input" type="text" autocomplete="username" placeholder="싱글 ID를 입력하세요" />
            <div class="login-id-suffix">@id</div>
          </div>
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input id="loginPassword" class="input" type="password" autocomplete="current-password" placeholder="비밀번호" />
        </label>
      </div>

      <label class="login-save">
        <input id="rememberLoginId" type="checkbox" />
        <span>아이디 저장</span>
      </label>
      <button class="btn btn-hero" id="loginBtn" style="width:100%">로그인</button>
      <div class="login-error" id="loginError"></div>
      <div class="login-note">이 워크스페이스는 워터마크 및 세션 기반 접속 로그가 기록됩니다.</div>
    </div>
  </div>

  <div class="watermark-layer" id="watermarkLayer" aria-hidden="true"></div>

  <div class="app-shell app-shell--locked" id="appShell">
    <header class="topbar">
      <div class="brand-block">
        <div class="logo">OP</div>
        <div>
          <div class="eyebrow">운영 콘솔</div>
          <div class="headline">Pulse</div>
        </div>
      </div>

      <div class="ctrl">
        <input id="dateInput" type="date" aria-label="Date" />
      </div>

      <div class="auth-box">
        <div class="auth-meta">
          <div class="auth-name" id="userName">-</div>
          <div class="auth-role" id="userRole">-</div>
        </div>
        <button class="btn btn-ghost" id="logoutBtn" type="button">로그아웃</button>
      </div>
    </header>

    <section class="hero-strip">
      <div class="hero-copy">
        <div class="eyebrow">보호된 워크스페이스</div>
        <h2>일일 사업장 운영 및 즉각적인 조치를 위한 빠르고 직관적인 워크스페이스입니다.</h2>
        <p id="sessionHint">현재 세션을 확인 중입니다.</p>
      </div>
      <div class="hero-glow"></div>
    </section>

    <nav class="tab-row" id="tabs">
      <button class="tab on" data-tab="worklog">업무 일지</button>
      <button class="tab"    data-tab="report">보고서</button>
      <button class="tab"    data-tab="insights">점검 결과</button>
      <button class="tab"    data-tab="calc">인당량 계산</button>
      <button class="tab"    data-tab="ref">기준표</button>
    </nav>

    <main>
      <section class="panel on" id="p-worklog"></section>
      <section class="panel"    id="p-report"></section>
      <section class="panel"    id="p-insights"></section>
      <section class="panel"    id="p-calc"></section>
      <section class="panel"    id="p-ref"></section>
    </main>
  </div>

  <div class="copy-toast" id="toast">Done</div>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
